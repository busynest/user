name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build && npm run rollup

      - name: Publish when the version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "pwa-auth@${version}" version >/dev/null 2>&1; then
            echo "pwa-auth@${version} is already on npm"
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Add an npm automation token as the NPM_TOKEN repository secret"
            exit 1
          fi
          npm publish --access public --ignore-scripts
