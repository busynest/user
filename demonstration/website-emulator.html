<!DOCTYPE html>
<html lang="en">
  <head>
    <title>pwa-auth</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1">
    <link rel="stylesheet" href="../website/css/pwa-styles.css">
    <link rel="stylesheet" href="../website/css/styles.css">
    <script>
      window.process = { env: {
        NODE_ENV: 'production',
        FIREBASE_CONFIG: JSON.stringify({
          apiKey: 'demo-key',
          authDomain: 'pwa-authentic.firebaseapp.com',
          projectId: 'pwa-authentic',
          storageBucket: 'pwa-authentic.appspot.com',
          messagingSenderId: '1',
          appId: '1:1:web:demo'
        })
      } };
      window.__alerts = [];
      window.alert = (message) => { window.__alerts.push(String(message)); };
      window.confirm = () => true;
    </script>
  </head>
  <body>

    <header>
      <div style="display: grid;">
        <iframe
          src="https://github.com/sponsors/busynest/button"
          title="Sponsor busynest"
          height="32"
          width="114"
          style="border: 0; border-radius: 6px; margin: auto 0 auto 0;"></iframe>
      </div>
      <span><h1>pwa-auth</h1></span>
      <user-icon></user-icon>
    </header>

    <user-drawer subscribe url="#account"></user-drawer>

    <main id="main">
      <p class="links">
        <a href="https://www.npmjs.com/package/pwa-auth">npm</a>
        <a href="https://github.com/busynest/user">GitHub</a>
        <a href="https://github.com/busynest/user/blob/master/intro.md">introduction</a>
        <a href="https://github.com/busynest/user/blob/master/README.md#quick-start">quick start</a>
      </p>

      <section id="drawer" style="display: grid;">
        <h2>Drawer Button</h2>
        <user-icon subscribe></user-icon>
      </section>

      <section id="login">
        <h2>Login Page</h2>
        <user-login login></user-login>
      </section>

      <section id="reset">
        <h2>email-reset</h2>
        <email-reset active></email-reset>
      </section>

      <section id="account">
        <h2>Settings Page</h2>
        <user-settings></user-settings>
      </section>
    </main>

    <script type="module" src="website-boot.js"></script>
  </body>
</html>
