<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Website emulator — pwa-auth</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1">
    <meta name="description" content="The site layout on the local Firebase emulator.">
    <link rel="canonical" href="https://pwa-authentic.firebaseapp.com/">
    <meta property="og:title" content="Website emulator — pwa-auth">
    <meta property="og:description" content="The site layout on the local Firebase emulator.">
    <meta property="og:url" content="https://pwa-authentic.firebaseapp.com/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://pwa-authentic.firebaseapp.com/images/manifest/logo-512.png">
    <link rel="stylesheet" href="../website/css/pwa-styles.css">
    <link rel="stylesheet" href="../website/css/styles.css">
    <script>
      window.process = { env: {
        NODE_ENV: 'production',
        FIREBASE_CONFIG: JSON.stringify({
          apiKey: 'demo-key',
          authDomain: 'pwa-authentic.firebaseapp.com',
          projectId: 'pwa-authentic',
          storageBucket: 'pwa-authentic.appspot.com',
          messagingSenderId: '1',
          appId: '1:1:web:demo'
        })
      } };
      window.__alerts = [];
      window.alert = (message) => { window.__alerts.push(String(message)); };
      window.confirm = () => true;
    </script>
  </head>
  <body>

    <header>
      <span><h1>pwa-auth</h1></span>
      <user-icon></user-icon>
    </header>

    <user-drawer subscribe url="#account"></user-drawer>

    <main id="main">
      <p>Turnkey Firebase sign-in UI. Drop in the tags.</p>
      <p><code>npm install pwa-auth</code></p>
      <p class="links">
        <a href="https://www.npmjs.com/package/pwa-auth">npm</a>
        <a href="https://github.com/busynest/user">GitHub</a>
        <a href="https://github.com/busynest/user/blob/master/README.md">docs</a>
      </p>

      <section id="drawer" style="display: grid;">
        <h2>Drawer Button</h2>
        <user-icon subscribe></user-icon>
      </section>

      <section id="login">
        <h2>Login Page</h2>
        <user-login login></user-login>
      </section>

      <section id="reset">
        <h2>email-reset</h2>
        <email-reset active></email-reset>
      </section>

      <section id="account">
        <h2>Settings Page</h2>
        <user-settings></user-settings>
      </section>
    </main>

    <script type="module" src="website-boot.js"></script>
  </body>
</html>
