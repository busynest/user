<!DOCTYPE html>
<html lang="en">

  <head>
    <title>pwa-auth</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1">

    <link rel="stylesheet" href="pwa-styles.css">
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

    <!-- Required - configure the Firebase instance before the module loads -->
    <script>
      window.process = { env: {
        NODE_ENV: 'production',
        FIREBASE_CONFIG: JSON.stringify({
          apiKey:             "AIzaSyC1ZNYC9RAjSAE3syUBNi47AiqbAqkx99w",
          authDomain:         "pwa-authentic.firebaseapp.com",
          projectId:          "pwa-authentic",
          storageBucket:      "pwa-authentic.firebasestorage.app",
          messagingSenderId:  "749233996232",
          appId:              "1:749233996232:web:bbc410d53b7d39bdfb80fd",
          measurementId:      "G-G1GYM1HBJ4"
        })
      } };
    </script>

  </head>
  <body>

    <header class="top">
      <div class="bar">
        <div>
          <h1>pwa-auth</h1>
          <p class="lede">Sign-in elements for your own pages.</p>
          <p><code>npm install pwa-auth</code></p>
          <p class="links">
            <a href="https://www.npmjs.com/package/pwa-auth">npm</a>
            <a href="https://github.com/busynest/user">GitHub</a>
            <a href="https://github.com/busynest/user/blob/master/README.md">docs</a>
            <a href="settings.html">Settings</a>
          </p>
        </div>
      </div>
    </header>

    <!-- Drop-down drawer. subscribe starts on the sign-up form. -->
    <user-drawer subscribe>
      <a slot="before" href="#settings">Settings</a>
      <a href="#events">Events</a>
    </user-drawer>

    <main class="wrap">

      <section class="card">
        <div class="stage">
          <user-icon subscribe></user-icon>
        </div>
      </section>

      <section class="card">
        <div class="panel">
          <user-login></user-login>
        </div>
      </section>

      <section class="card">
        <div class="panel">
          <email-reset active></email-reset>
        </div>
      </section>

      <section class="card" id="settings">
        <div class="panel">
          <user-settings></user-settings>
        </div>
      </section>

      <section class="card" id="events">
        <ol id="event-log" class="log"></ol>
      </section>

    </main>

    <script type="module">
      import {
        pwaAuthChanged,
        pwaLogin,
        pwaLogout,
        pwaSignup,
        pwaAccountDeleted,
        pwaProfileUpdated,
        pwaEmailChanged,
        pwaPasswordChanged,
        pwaResetSent,
        pwaDrawerToggleName,
        pwaAuthError,
        userEmailChanged
      } from '../base/export/pwa-auth.js';

      const names = [
        pwaAuthChanged,
        pwaLogin,
        pwaLogout,
        pwaSignup,
        pwaAccountDeleted,
        pwaProfileUpdated,
        pwaEmailChanged,
        pwaPasswordChanged,
        pwaResetSent,
        pwaDrawerToggleName,
        pwaAuthError,
        userEmailChanged
      ];

      const log = document.querySelector('#event-log');
      const waiting = log.querySelector('.quiet');

      for (const name of names) {
        window.addEventListener(name, (event) => {
          if (waiting) waiting.remove();
          const item = document.createElement('li');
          const detail = event instanceof CustomEvent ? event.detail : undefined;
          item.textContent = name + ' ' + JSON.stringify(detail);
          log.prepend(item);
          while (log.children.length > 12) log.lastElementChild.remove();
        });
      }
    </script>

  </body>

</html>
