<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Auth emulator — pwa-auth</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1">
    <meta name="description" content="Sign-in elements on the local Firebase emulator.">
    <link rel="canonical" href="https://pwa-authentic.firebaseapp.com/">
    <meta property="og:title" content="Auth emulator — pwa-auth">
    <meta property="og:description" content="Sign-in elements on the local Firebase emulator.">
    <meta property="og:url" content="https://pwa-authentic.firebaseapp.com/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://pwa-authentic.firebaseapp.com/images/manifest/logo-512.png">
    <link rel="stylesheet" href="pwa-styles.css">
    <link rel="stylesheet" href="styles.css">
    <script>
      window.process = { env: {
        NODE_ENV: 'production',
        FIREBASE_CONFIG: JSON.stringify({
          apiKey: 'demo-key',
          authDomain: 'pwa-authentic.firebaseapp.com',
          projectId: 'pwa-authentic',
          storageBucket: 'pwa-authentic.appspot.com',
          messagingSenderId: '1',
          appId: '1:1:web:demo'
        })
      } };
      window.__alerts = [];
      window.alert = (message) => { window.__alerts.push(String(message)); };
      window.confirm = () => true;
    </script>
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <div>
          <h1>pwa-auth</h1>
          <p class="lede">Turnkey Firebase sign-in UI. Drop in the tags.</p>
          <p><code>npm install pwa-auth</code></p>
          <p class="links">
            <a href="https://www.npmjs.com/package/pwa-auth">npm</a>
            <a href="https://github.com/busynest/user">GitHub</a>
            <a href="https://github.com/busynest/user/blob/master/README.md">docs</a>
          </p>
        </div>
      </div>
    </header>

    <user-drawer subscribe></user-drawer>

    <main class="wrap">
      <section class="card">
        <div class="stage">
          <user-icon subscribe></user-icon>
        </div>
      </section>

      <section class="card">
        <div class="panel">
          <user-login subscribe></user-login>
        </div>
      </section>

      <section class="card">
        <div class="panel">
          <email-reset active></email-reset>
        </div>
      </section>

      <section class="card">
        <div class="panel">
          <user-settings id="settings"></user-settings>
        </div>
      </section>

      <section class="card">
        <ol id="event-log" class="log"></ol>
      </section>
    </main>

    <script type="module" src="emulator-boot.js"></script>
  </body>
</html>
