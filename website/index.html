            apiKey:             "AIzaSyC1ZNYC9RAjSAE3syUBNi47AiqbAqkx99w",
            authDomain:         "pwa-authentic.firebaseapp.com",

    <script type="module" src="./javascript/pwa-auth.js" defer></script> -->
    <script type="module" src="./javascript/pwa-auth.js" defer></script>

  </head>
  <body>

    <header>

      <span><h1>pwa-auth</h1></span>

      <user-icon></user-icon>

    </header>

    <!-- Drop-down - Drawer. url is an in-page anchor, not a route. Slot markers show until a host passes links. -->
    <user-drawer      subscribe    url="#account"></user-drawer>

    <main id="main">

      <p>Turnkey Firebase sign-in UI. Drop in the tags.</p>

      <p><code>npm install pwa-auth</code></p>

      <p class="links">
        <a href="https://www.npmjs.com/package/pwa-auth">npm</a>
        <a href="https://github.com/busynest/user">GitHub</a>
        <a href="https://github.com/busynest/user/blob/master/README.md">docs</a>
      </p>

      <section id="drawer" style="display: grid;">

        <h2>Drawer Button</h2>

        <!-- Login / Subscribe - Button -->
        <user-icon      subscribe    ></user-icon>

      </section>

      <section id="login">

        <h2>Login Page</h2>

        <!-- Log-in - -Page-->
        <user-login     login     ></user-login>

      </section>

      <section id="reset">

        <h2>email-reset</h2>

        <email-reset active></email-reset>

      </section>

      <section id="account">

        <h2>Settings Page</h2>

        <!-- Settings - Page-->
        <user-settings></user-settings>

      </section>

    </main>

    <noscript>
      <a href="https://firebase.google.com/docs/auth/web/firebaseui">FirebaseUI</a>
      <a href="https://clerk.com">Clerk</a>
      <a href="https://clerk.com/docs">Clerk docs</a>
      <a href="https://auth0.com">Auth0</a>
      <a href="https://github.com/supabase-community/auth-ui">Supabase Auth UI</a>
      <a href="https://supabase.com/docs/guides/auth">Supabase Auth</a>
      <a href="https://docs.amplify.aws/react/frontend/auth/using-the-authenticator/">Amplify Authenticator</a>
      <a href="https://github.com/pwa-builder/pwa-auth">PWABuilder pwa-auth</a>
    </noscript>

  </body>

</html>
