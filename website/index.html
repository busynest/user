  <body>

    <header>

      <div style="display: grid;">
        
        <!-- Sponsor Me -->
        <iframe
          src="https://github.com/sponsors/busynest/button"
          title="Sponsor busynest"
          height="32"
          width="114"
          style="border: 0; border-radius: 6px;  margin: auto 0 auto 0;"></iframe>

      </div>

      <span></span>

      <user-icon      empty="./images/empty.jpg"></user-icon>

    </header>

    <!-- Drop-down - Drawer-->
    <user-drawer      url="./settings"     subscribe    ></user-drawer>

    <main>

      <p>Five elements share one session: user-icon, user-drawer, user-login, user-settings, and email-reset. Listen for pwa- events, call the small API, restyle with --pwa_ variables.</p>

      <section style="display: grid;">

        <h2>user-icon</h2>

        <!-- Login / Subscribe - Button -->
        <user-icon      empty="./images/empty.jpg"    subscribe    ></user-icon>

      </section>

      <section>

        <h2>user-login</h2>

        <!-- Log-in - -Page-->
        <user-login     login     ></user-login>

      </section>

      <section>

        <h2>email-reset</h2>

        <email-reset active></email-reset>

      </section>

      <section>

        <h2>user-settings</h2>

        <!-- Settings - Page-->
        <user-settings  empty="./images/empty.jpg"></user-settings>

      </section>

    </main>

  </body>

</html>
